<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraQuiz - Premium Edition</title>
    <!-- Font Awesome Icons & Google Fonts -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Firebase App & Database Scripts -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <style>
        :root {
            --bg-color: #050505;
            --card-bg: #0d0d0d;
            --card-border: rgba(255, 255, 255, 0.12);
            --card-border-glow: rgba(255, 255, 255, 0.25);
            --text-primary: #ffffff;
            --text-secondary: #a1a1aa;
            --accent-btn: #ffffff;
            --accent-btn-text: #000000;
            --accent-bg: rgba(255, 255, 255, 0.08);
            --gold-accent: #d4af37;
            --nav-bg: #09090b;
            --input-bg: #121215;
        }

        [data-theme="light"] {
            --bg-color: #f4f4f5;
            --card-bg: #ffffff;
            --card-border: rgba(0, 0, 0, 0.1);
            --card-border-glow: rgba(0, 0, 0, 0.25);
            --text-primary: #09090b;
            --text-secondary: #71717a;
            --accent-btn: #09090b;
            --accent-btn-text: #ffffff;
            --accent-bg: rgba(0, 0, 0, 0.05);
            --gold-accent: #b8860b;
            --nav-bg: #ffffff;
            --input-bg: #f4f4f5;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: var(--text-primary);
            overflow-x: hidden;
        }

        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Top Header */
        header {
            width: 100%;
            padding: 20px 24px;
            background: var(--bg-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            border-bottom: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .logo {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .logo-icon-box {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, #ffffff 0%, #71717a 100%);
            border-radius: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #000;
            box-shadow: 0 4px 12px rgba(255, 255, 255, 0.15);
        }

        [data-theme="light"] .logo-icon-box {
            background: linear-gradient(135deg, #09090b 0%, #3f3f46 100%);
            color: #fff;
        }

        .logo-icon-box i {
            font-size: 18px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            background: var(--card-bg);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s ease;
        }

        .icon-btn:hover {
            border-color: var(--card-border-glow);
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        /* Main Full Width Layout */
        main {
            flex: 1;
            width: 100%;
            padding: 16px 18px 90px 18px;
        }

        .page { display: none; }
        .page.active { display: block; animation: fadeIn 0.3s ease-in-out; }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(4px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Category Card List Styling */
        .page-title {
            font-size: 22px;
            font-weight: 800;
            margin: 16px 0 20px 4px;
            color: var(--text-primary);
            letter-spacing: -0.5px;
        }

        .category-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 20px;
            margin-bottom: 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            width: 100%;
            border: 1px solid var(--card-border);
            transition: all 0.25s ease;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
        }

        .category-card:hover {
            border-color: var(--card-border-glow);
            transform: translateY(-2px);
        }

        .category-card:active {
            transform: scale(0.98);
        }

        .cat-info {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .cat-icon-wrapper {
            width: 50px;
            height: 50px;
            border-radius: 14px;
            background: var(--accent-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
        }

        .cat-details h3 {
            font-size: 17px;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 4px;
        }

        .cat-details p {
            font-size: 12px;
            color: var(--text-secondary);
            font-weight: 500;
        }

        .cat-arrow {
            color: var(--text-secondary);
            font-size: 14px;
            opacity: 0.6;
        }

        /* Quiz Play Area */
        .quiz-top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            font-weight: 700;
            padding: 0 4px;
        }

        .timer-badge {
            background: var(--accent-bg);
            border: 1px solid var(--card-border);
            color: var(--text-primary);
            padding: 8px 18px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 14px;
            letter-spacing: 0.5px;
        }

        .question-box {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 26px;
            margin-bottom: 20px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .question-text {
            font-size: 18px;
            font-weight: 700;
            line-height: 1.6;
            margin-bottom: 24px;
            color: var(--text-primary);
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .option-card {
            background: var(--input-bg);
            border: 1px solid var(--card-border);
            padding: 16px 20px;
            border-radius: 16px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 14px;
            font-weight: 600;
            font-size: 15px;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .option-card:hover {
            border-color: var(--card-border-glow);
            background: var(--accent-bg);
        }

        .option-card.correct {
            background: rgba(34, 197, 94, 0.1) !important;
            border-color: #22c55e !important;
            color: #4ade80 !important;
        }

        .option-card.wrong {
            background: rgba(239, 68, 68, 0.1) !important;
            border-color: #ef4444 !important;
            color: #f87171 !important;
        }

        /* Auth Screen */
        .auth-card {
            background: var(--card-bg);
            border-radius: 24px;
            padding: 32px 24px;
            margin-top: 10px;
            border: 1px solid var(--card-border);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
        }

        .auth-title {
            font-size: 22px;
            font-weight: 800;
            margin-bottom: 28px;
            text-align: center;
            letter-spacing: -0.5px;
        }

        .input-group { margin-bottom: 20px; }
        .input-group label {
            font-size: 12px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-secondary);
            margin-bottom: 8px;
            display: block;
        }

        .form-input {
            width: 100%;
            padding: 16px 18px;
            border-radius: 14px;
            border: 1px solid var(--card-border);
            background: var(--input-bg);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-input:focus {
            border-color: var(--card-border-glow);
        }

        /* Black & White Luxury Buttons */
        .btn-gradient {
            width: 100%;
            padding: 16px;
            border-radius: 14px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: var(--accent-btn);
            color: var(--accent-btn-text);
            font-weight: 800;
            font-size: 15px;
            letter-spacing: 0.5px;
            cursor: pointer;
            margin-top: 10px;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(255, 255, 255, 0.08);
        }

        [data-theme="light"] .btn-gradient {
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
        }

        .btn-gradient:hover {
            opacity: 0.92;
            transform: translateY(-1px);
        }

        .btn-gradient:active {
            transform: scale(0.98);
        }

        .btn-secondary {
            background: transparent !important;
            color: var(--text-primary) !important;
            border: 1px solid var(--card-border) !important;
            box-shadow: none !important;
        }

        .btn-secondary:hover {
            background: var(--accent-bg) !important;
        }

        /* Leaderboard */
        .lb-card {
            background: var(--card-bg);
            border-radius: 18px;
            padding: 16px 20px;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid var(--card-border);
        }

        .user-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--card-border);
            background: var(--input-bg);
        }

        /* Bottom Fixed Navigation Bar */
        nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background: var(--nav-bg);
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 12px 0 16px 0;
            z-index: 1000;
            border-top: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            font-size: 11px;
            font-weight: 700;
            cursor: pointer;
            width: 33.33%;
            transition: color 0.2s ease;
        }

        .nav-item.active {
            color: var(--text-primary);
        }

        .nav-item i {
            font-size: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <div class="logo-icon-box"><i class="fa-solid fa-crown"></i></div>
            <span>AuraQuiz</span>
        </div>
        <div class="header-actions">
            <button class="icon-btn" onclick="toggleLanguage()"><i class="fa-solid fa-language"></i></button>
            <button class="icon-btn" onclick="toggleTheme()"><i class="fa-solid fa-moon" id="theme-icon"></i></button>
        </div>
    </header>

    <main>
        <!-- Auth Screen -->
        <div id="page-auth" class="page active">
            <div class="auth-card">
                <h2 class="auth-title" id="txt-auth-head">সাইন আপ / লগইন</h2>
                
                <div id="signup-form">
                    <div class="input-group">
                        <label id="lbl-u1">ইউজারনেম</label>
                        <input type="text" id="signup-user" class="form-input" placeholder="e.g. aura_king">
                    </div>
                    <div class="input-group">
                        <label id="lbl-p1">পাসওয়ার্ড</label>
                        <input type="password" id="signup-pass" class="form-input" placeholder="••••••••">
                    </div>
                    <button class="btn-gradient" type="button" onclick="registerUser()">সাইন আপ করুন</button>
                    <p style="text-align: center; margin-top: 22px; font-size: 14px; color: var(--text-secondary);">
                        <span id="txt-has-acc">অ্যাকাউন্ট আছে?</span> <a href="javascript:void(0)" onclick="toggleAuth(false)" style="color: var(--text-primary); font-weight:700; text-decoration:underline;" id="lnk-login">লগইন</a>
                    </p>
                </div>

                <div id="login-form" style="display: none;">
                    <div class="input-group">
                        <label id="lbl-u2">ইউজারনেম</label>
                        <input type="text" id="login-user" class="form-input" placeholder="Username">
                    </div>
                    <div class="input-group">
                        <label id="lbl-p2">পাসওয়ার্ড</label>
                        <input type="password" id="login-pass" class="form-input" placeholder="••••••••">
                    </div>
                    <button class="btn-gradient" type="button" onclick="loginUser()">লগইন করুন</button>
                    <p style="text-align: center; margin-top: 22px; font-size: 14px; color: var(--text-secondary);">
                        <span id="txt-no-acc">অ্যাকাউন্ট নেই?</span> <a href="javascript:void(0)" onclick="toggleAuth(true)" style="color: var(--text-primary); font-weight:700; text-decoration:underline;" id="lnk-signup">সাইন আপ</a>
                    </p>
                </div>
            </div>
        </div>

        <!-- Categories Screen -->
        <div id="page-quiz" class="page">
            <h2 class="page-title" id="txt-select-cat">ক্যাটাগরি সিলেক্ট করুন</h2>
            <div id="category-container"></div>
        </div>

        <!-- Active Quiz Screen -->
        <div id="page-quiz-play" class="page">
            <div class="quiz-top-bar">
                <span id="q-counter">প্রশ্ন ১/২০</span>
                <div class="timer-badge"><i class="fa-solid fa-stopwatch"></i> <span id="timer">20</span>s</div>
                <span id="score-display">মার্কস: ০/২০</span>
            </div>

            <div class="question-box">
                <div class="question-text" id="q-text">প্রশ্ন লোড হচ্ছে...</div>
                <div class="options-grid" id="options-box"></div>
            </div>
        </div>

        <!-- Global Leaderboard -->
        <div id="page-leaderboard" class="page">
            <h2 class="page-title" id="txt-lb-head">টপার লিডারবোর্ড (মোট নম্বর)</h2>
            <div id="lb-list"></div>
        </div>

        <!-- Profile Screen -->
        <div id="page-profile" class="page">
            <div class="auth-card" style="text-align: center;">
                <div style="position: relative; width: 88px; height: 88px; margin: 0 auto 18px auto;">
                    <img id="profile-img" src="" class="user-avatar" style="width:100%; height:100%;">
                    <label for="img-upload" style="position: absolute; bottom:0; right:0; background:var(--accent-btn); color:var(--accent-btn-text); width:32px; height:32px; border-radius:50%; display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow: 0 2px 8px rgba(0,0,0,0.3);">
                        <i class="fa-solid fa-camera" style="font-size:13px;"></i>
                    </label>
                    <input type="file" id="img-upload" style="display: none;" accept="image/*" onchange="uploadAvatar(event)">
                </div>
                
                <h3 id="profile-total-score" style="margin-bottom:24px; color:var(--gold-accent); font-size: 18px; font-weight:800; letter-spacing:0.5px;">মোট অর্জিত মার্কস: ০</h3>

                <div class="input-group" style="text-align: left;">
                    <label id="lbl-edit-u">ইউজারনেম</label>
                    <input type="text" id="edit-user" class="form-input" readonly style="opacity: 0.5; cursor: not-allowed;">
                </div>
                <div class="input-group" style="text-align: left;">
                    <label id="lbl-edit-p">নতুন পাসওয়ার্ড</label>
                    <input type="password" id="edit-pass" class="form-input" placeholder="New Password">
                </div>
                <button class="btn-gradient" onclick="updateProfile()" id="btn-save-prof">সেভ করুন</button>
                <button class="btn-gradient btn-secondary" onclick="logout()" id="btn-logout">লগআউট</button>
            </div>
        </div>
    </main>

    <!-- Bottom Nav -->
    <nav id="nav-bar" style="display: none;">
        <button class="nav-item active" id="nav-btn-quiz" onclick="switchPage('quiz')">
            <i class="fa-solid fa-gamepad"></i> <span id="lbl-nav-q">কুইজ</span>
        </button>
        <button class="nav-item" id="nav-btn-leaderboard" onclick="switchPage('leaderboard')">
            <i class="fa-solid fa-trophy"></i> <span id="lbl-nav-l">লিডারবোর্ড</span>
        </button>
        <button class="nav-item" id="nav-btn-profile" onclick="switchPage('profile')">
            <i class="fa-solid fa-user"></i> <span id="lbl-nav-p">প্রোফাইল</span>
        </button>
    </nav>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyCoK0n-nqXdHOleKsDsm4M91z-901cV3XQ",
            authDomain: "khelenge.firebaseapp.com",
            databaseURL: "https://khelenge-default-rtdb.firebaseio.com",
            projectId: "khelenge",
            storageBucket: "khelenge.firebasestorage.app",
            messagingSenderId: "357341843813",
            appId: "1:357341843813:web:85f7e280cd4e4a63d7518c",
            measurementId: "G-L8P75FJTSF"
        };
        
        let db = null;
        try {
            firebase.initializeApp(firebaseConfig);
            db = firebase.database();
        } catch(e) {
            console.error("Firebase init failed:", e);
        }

        const categoryMeta = {
            football: { nameBn: "ফুটবল", nameEn: "Football", icon: "fa-futbol" },
            cricket: { nameBn: "ক্রিকেট", nameEn: "Cricket", icon: "fa-baseball-bat-ball" },
            bus: { nameBn: "বাস ও ট্রান্সপোর্ট", nameEn: "Bus & Transport", icon: "fa-bus-simple" },
            train: { nameBn: "ট্রেন ও রেলওয়ে", nameEn: "Train & Railway", icon: "fa-train" },
            mobile: { nameBn: "মোবাইল টেকনোলজি", nameEn: "Mobile Technology", icon: "fa-mobile-screen-button" }
        };

        const quizBank = {
            football: [
                { q: "১. প্রথম ফুটবল বিশ্বকাপ (১৯৩০) ফাইনালে আর্জেন্টিনা কোন দেশকে হারিয়ে চ্যাম্পিয়ন হয়?", opts: ["উরুগুয়ে", "ব্রাজিল", "ইতালি", "জার্মানি"], ans: 0 },
                { q: "২. চ্যাম্পিয়ন্স লিগের ইতিহাসে এক মৌসুমে সর্বোচ্চ গোল (১৭টি) করার রেকর্ড কার?", opts: ["মেসি", "ক্রিশ্টিয়ানো রোনালদো", "বেনজেমা", "লেভানডফস্কি"], ans: 1 },
                { q: "৩. ফুটবল ইতিহাসে প্রথম 'হলুদ কার্ড' কোন বিশ্বকাপে চালু হয়েছিল?", opts: ["১৯৬৬", "১৯৭০", "১৯৭৪", "১৯৫৮"], ans: 1 },
                { q: "৪. বেলন ডি'অর জয়ী একমাত্র গোলরক্ষক কে?", opts: ["বুফন", "কাসিয়াস", "লেভ ইয়াসিন", "ম্যানুয়েল নয়ার"], ans: 2 },
                { q: "৫. ইংলিশ প্রিমিয়ার লিগে এক মৌসুমে সর্বনিম্ন গোল খাওয়ার রেকর্ড কোন ক্লাবের?", opts: ["ম্যান সিটি", "চেচসি", "আর্সেনাল", "ম্যান ইউ"], ans: 1 },

        window.onload = function() {
            checkAutoLogin();

        function checkAutoLogin() {
            const savedUser = localStorage.getItem('aura_quiz_user');
            if (savedUser && db) {
                db.ref('users/' + savedUser).once('value').then(snapshot => {
                    if (snapshot.exists()) {
                        currentUser = snapshot.val();
                        if (!currentUser.completedCategories) {
                            currentUser.completedCategories = {};
                        }
                        enterApp();
                    } else {
                        localStorage.removeItem('aura_quiz_user');
                    }
                }).catch(() => {});
            }
        }

        function toggleAuth(showSignUp) {
            document.getElementById('signup-form').style.display = showSignUp ? 'block' : 'none';
            document.getElementById('login-form').style.display = showSignUp ? 'none' : 'block';
        }

        function registerUser() {
            const u = document.getElementById('signup-user').value.trim().toLowerCase();
            const p = document.getElementById('signup-pass').value.trim();

            if (!u || !p) {
                alert("ইউজারনেম এবং পাসওয়ার্ড উভয়ই পূরণ করুন!");
                return;
            }

            if (!/^[a-z0-9_]+$/.test(u) || p.length < 4) {
                alert("ইউজারনেমে শুধু ছোট হাতের বর্ণ/সংখ্যা এবং পাসওয়ার্ড অন্তত ৪ অক্ষরের হতে হবে!");
                return;
            }

            if (!db) {
                alert("Firebase রিফ্রেশ প্রয়োজন!");
                return;
            }

            db.ref('users/' + u).once('value').then(snapshot => {
                if (snapshot.exists()) {
                    alert("ইউজারনেমটি আগে থেকেই নেওয়া!");
                } else {
                    const userData = {
                        username: u,
                        password: p,
                        totalScore: 0,
                        avatar: `https://api.dicebear.com/7.x/avataaars/svg?seed=${u}`,
                        completedCategories: {}
                    };
                    db.ref('users/' + u).set(userData).then(() => {
                        alert("সাইন আপ সফল হয়েছে!");
                        toggleAuth(false);
                    });
                }
            });
        }

        function loginUser() {
            const u = document.getElementById('login-user').value.trim().toLowerCase();
            const p = document.getElementById('login-pass').value.trim();

            if (!u || !p) {
                alert("ইউজারনেম ও পাসওয়ার্ড দিন!");
                return;
            }

            if (!db) return;

            db.ref('users/' + u).once('value').then(snapshot => {
                if (snapshot.exists() && snapshot.val().password === p) {
                    currentUser = snapshot.val();
                    if (!currentUser.completedCategories) {
                        currentUser.completedCategories = {};
                    }
                    localStorage.setItem('aura_quiz_user', u);
                    enterApp();
                } else {
                    alert("ইউজারনেম অথবা পাসওয়ার্ড ভুল!");
                }
            });
        }

        function logout() {
            localStorage.removeItem('aura_quiz_user');
            currentUser = null;
            location.reload();
        }

            document.getElementById('nav-bar').style.display = 'flex';
            switchPage('quiz');

                }

                availableCount++;
                const meta = categoryMeta[catKey];
                const card = document.createElement('div');
                card.className = 'category-card';
                card.onclick = () => startQuiz(catKey);

                card.innerHTML = `
                    <div class="cat-info">
                        <div class="cat-icon-wrapper"><i class="fa-solid ${meta.icon}"></i></div>
                        <div class="cat-details">
                            <h3>${currentLang === 'bn' ? meta.nameBn : meta.nameEn}</h3>
                            <p>${currentLang === 'bn' ? '২০ মার্কস (২০ সেকেন্ড/প্রশ্ন)' : '20 Marks (20s/question)'}</p>
                        </div>
                    </div>
                    <i class="fa-solid fa-chevron-right cat-arrow"></i>
                `;
                container.appendChild(card);
            });

            if (availableCount === 0) {
                container.innerHTML = `
                    <div style="text-align: center; padding: 40px 20px; background: var(--card-bg); border: 1px solid var(--card-border); border-radius: 20px;">
                        <i class="fa-solid fa-circle-check" style="font-size: 48px; color: #22c55e; margin-bottom: 12px;"></i>
                        <h3 style="font-size: 18px; font-weight: 800;">${currentLang === 'bn' ? 'সব কুইজ সম্পন্ন হয়েছে!' : 'All Quizzes Completed!'}</h3>
                    </div>
                `;
            }
        }

        function switchPage(page) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

            const targetPage = document.getElementById('page-' + page);
            if (targetPage) targetPage.classList.add('active');

            const targetBtn = document.getElementById('nav-btn-' + page);
            if (targetBtn) targetBtn.classList.add('active');

            if (page === 'quiz') renderCategories();
            if (page === 'leaderboard') renderLeaderboard();
            if (page === 'profile') loadProfileInfo();
        }

        function startQuiz(cat) {
            quizCategory = cat;
            qIndex = 0;
            currentQuizMarks = 0;
            switchPage('quiz-play');
            loadQuestion();
        }

        function loadQuestion() {
            clearInterval(timerInterval);
            const qList = quizBank[quizCategory];

            if (qIndex >= qList.length) {
                finishQuiz();
                return;
            }

            const currentQ = qList[qIndex];
            document.getElementById('q-counter').innerText = currentLang === 'bn' ? `প্রশ্ন ${qIndex + 1}/২০` : `Question ${qIndex + 1}/20`;
            document.getElementById('score-display').innerText = currentLang === 'bn' ? `মার্কস: ${currentQuizMarks}/২০` : `Score: ${currentQuizMarks}/20`;
            document.getElementById('q-text').innerText = currentQ.q;

            const box = document.getElementById('options-box');
            box.innerHTML = '';

            currentQ.opts.forEach((opt, i) => {
                const btn = document.createElement('div');
                btn.className = 'option-card';
                btn.innerHTML = `<span style="width:26px; height:26px; border-radius:50%; background:var(--accent-bg); border:1px solid var(--card-border); display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:800;">${String.fromCharCode(65+i)}</span> <span>${opt}</span>`;
                btn.onclick = () => answer(i);
                box.appendChild(btn);
            });

            timerVal = 20;
            document.getElementById('timer').innerText = timerVal;
            timerInterval = setInterval(() => {
                timerVal--;
                document.getElementById('timer').innerText = timerVal;
                if (timerVal <= 0) {
                    clearInterval(timerInterval);
                    qIndex++;
                    loadQuestion();
                }
            }, 1000);
        }

        function answer(selected) {
            clearInterval(timerInterval);
            const currentQ = quizBank[quizCategory][qIndex];
            const cards = document.querySelectorAll('.option-card');

            cards.forEach(c => c.style.pointerEvents = 'none');

            if (selected === currentQ.ans) {
                cards[selected].classList.add('correct');
                currentQuizMarks += 1;
            } else {
                cards[selected].classList.add('wrong');
                cards[currentQ.ans].classList.add('correct');
            }

            setTimeout(() => {
                qIndex++;
                loadQuestion();
            }, 1200);
        }

        function finishQuiz() {
            alert(currentLang === 'bn' ? `কুইজ সম্পন্ন হয়েছে!\nপ্রাপ্ত নম্বর: ${currentQuizMarks}/২০` : `Quiz Completed!\nScore: ${currentQuizMarks}/20`);
            
            const newTotalScore = (currentUser.totalScore || 0) + currentQuizMarks;
            currentUser.totalScore = newTotalScore;

            if (!currentUser.completedCategories) {
                currentUser.completedCategories = {};
            }
            currentUser.completedCategories[quizCategory] = true;
            
            if (db) {
                db.ref('users/' + currentUser.username + '/totalScore').set(newTotalScore);
                db.ref('users/' + currentUser.username + '/completedCategories/' + quizCategory).set(true);
            }
            switchPage('quiz');
        }

        function renderLeaderboard() {
            const list = document.getElementById('lb-list');
            list.innerHTML = '<p style="text-align:center; padding:20px; color:var(--text-secondary);">লোড হচ্ছে...</p>';

            if (!db) return;

            db.ref('users').orderByChild('totalScore').limitToLast(20).once('value').then(snapshot => {
                list.innerHTML = '';
                let users = [];
                snapshot.forEach(child => { users.push(child.val()); });
                users.reverse();

                users.forEach((u, rank) => {
                    const card = document.createElement('div');
                    card.className = 'lb-card';
                    card.innerHTML = `
                        <div style="display:flex; align-items:center; gap:14px;">
                            <span style="font-weight:800; font-size:15px; width:24px; color:${rank===0?'var(--gold-accent)':rank===1?'#e4e4e7':rank===2?'#a1a1aa':'var(--text-secondary)'}">#${rank+1}</span>
                            <img src="${u.avatar}" class="user-avatar">
                            <span style="font-weight:700; font-size:15px;">${u.username}</span>
                        </div>
                        <span style="font-weight:800; color:var(--text-primary); font-size:14px;">${u.totalScore || 0} Marks</span>
                    `;
                    list.appendChild(card);
                });
            });
        }

        function loadProfileInfo() {
            document.getElementById('edit-user').value = currentUser.username;
            document.getElementById('edit-pass').value = currentUser.password;
            document.getElementById('profile-img').src = currentUser.avatar;
            document.getElementById('profile-total-score').innerText = currentLang === 'bn' ? `মোট অর্জিত মার্কস: ${currentUser.totalScore || 0}` : `Total Marks: ${currentUser.totalScore || 0}`;
        }

        function uploadAvatar(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(evt) {
                    const base64 = evt.target.result;
                    currentUser.avatar = base64;
                    document.getElementById('profile-img').src = base64;
                    if (db) {
                        db.ref('users/' + currentUser.username + '/avatar').set(base64);
                    }
                };
                reader.readAsDataURL(file);
            }
        }

        function updateProfile() {
            const newP = document.getElementById('edit-pass').value.trim();
            if (newP.length < 4) {
                alert("পাসওয়ার্ড অন্তত ৪ অক্ষরের হতে হবে!");
                return;
            }
            currentUser.password = newP;
            if (db) {
                db.ref('users/' + currentUser.username + '/password').set(newP).then(() => {
                    alert("পাসওয়ার্ড আপডেট হয়েছে!");
                });
            }
        }

        function toggleTheme() {
            currentTheme = currentTheme === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', currentTheme);
            document.getElementById('theme-icon').className = currentTheme === 'dark' ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        function toggleLanguage() {
            currentLang = currentLang === 'bn' ? 'en' : 'bn';
            const isBn = currentLang === 'bn';

            document.getElementById('txt-auth-head').innerText = isBn ? "সাইন আপ / লগইন" : "Sign Up / Login";
            document.getElementById('txt-select-cat').innerText = isBn ? "ক্যাটাগরি সিলেক্ট করুন" : "Select Category";
            document.getElementById('txt-lb-head').innerText = isBn ? "টপার লিডারবোর্ড (মোট নম্বর)" : "Topper Leaderboard";
            document.getElementById('btn-save-prof').innerText = isBn ? "সেভ করুন" : "Save Changes";
            document.getElementById('btn-logout').innerText = isBn ? "লগআউট" : "Logout";

            document.getElementById('lbl-nav-q').innerText = isBn ? "কুইজ" : "Quiz";
            document.getElementById('lbl-nav-l').innerText = isBn ? "লিডারবোর্ড" : "Leaderboard";
            document.getElementById('lbl-nav-p').innerText = isBn ? "প্রোফাইল" : "Profile";

            if (currentUser) {
                renderCategories();
            }
        }
    </script>
</body>
</html>
